<script>
/* Akhand 108 sound: Web Audio only, no files. Driven by the page's real events:
   window.__snd.note/bell/mode/state/verse are called from the page script below. */
(function () {
  "use strict";
  var AC = window.AudioContext || window.webkitAudioContext;
  var TONIC = 138.59;                           // C#3
  var RATIO = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3];  // Sa Re Ga Pa Dha, just intonation
  var STATION_POS = [3, 5, 7, 2, 4, 8, 6, 9, 10, 11, 1, 12]; // station -> step on a 3-octave pentatonic ladder
  var CEIL = 0.8;                               // hard ceiling after the compressor (-1.9 dBFS)
  var PULSE = 0.14, QUEUE_MAX = 8, VOICE_MAX = 12, IDLE_MS = 2500, FADE_OUT = 2.5, FADE_IN = 1.8;
  function scaleHz(pos) { return TONIC * Math.pow(2, Math.floor(pos / 5)) * RATIO[pos % 5]; }
  // tanpura cycle: Pa (low), Sa, Sa, Sa (lower octave)
  var CYCLE = [{ f: TONIC * 0.75, v: 0.85, gap: 1.25 }, { f: TONIC, v: 1, gap: 1.25 }, { f: TONIC, v: 0.9, gap: 1.25 }, { f: TONIC * 0.5, v: 1.1, gap: 1.6 }];

  // ---------- synthesis (shared by the live page and the offline render) ----------
  function impulse(ctx, secs) {
    var sr = ctx.sampleRate, n = Math.floor(sr * secs), b = ctx.createBuffer(2, n, sr), seed = 12345;
    for (var c = 0; c < 2; c++) {
      var d = b.getChannelData(c), lp = 0;
      for (var i = 0; i < n; i++) {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        var r = (seed / 4294967296) * 2 - 1;
        lp += (r - lp) * (0.55 - 0.4 * i / n);       // darker as it decays
        d[i] = lp * Math.pow(1 - i / n, 2.6) * 1.4;
      }
    }
    return b;
  }
  function makeGraph(ctx) {
    var g = {};
    g.live = ctx.createGain(); g.live.gain.value = 0;       // activity fade (real events only)
    g.master = ctx.createGain(); g.master.gain.value = 0;   // user on/off
    g.comp = ctx.createDynamicsCompressor();
    g.comp.threshold.value = -14; g.comp.knee.value = 10; g.comp.ratio.value = 4; g.comp.attack.value = 0.01; g.comp.release.value = 0.35;
    g.shaper = ctx.createWaveShaper();
    var curve = new Float32Array(2049);
    for (var i = 0; i < curve.length; i++) { var x = (i / 1024 - 1) * 2; curve[i] = CEIL * Math.tanh(x / CEIL); }
    g.shaper.curve = curve;
    g.drone = ctx.createGain(); g.drone.gain.value = 1;
    g.notes = ctx.createGain(); g.duck = ctx.createGain();
    g.bells = ctx.createGain();
    g.send = ctx.createGain();
    g.conv = ctx.createConvolver(); g.conv.buffer = impulse(ctx, 3.2);
    g.wet = ctx.createGain(); g.wet.gain.value = 0.42;
    var dSend = ctx.createGain(); dSend.gain.value = 0.22;
    var nSend = ctx.createGain(); nSend.gain.value = 0.5;
    var bSend = ctx.createGain(); bSend.gain.value = 0.55;
    g.drone.connect(g.live); g.drone.connect(dSend); dSend.connect(g.send);
    g.notes.connect(g.duck); g.duck.connect(g.live); g.duck.connect(nSend); nSend.connect(g.send);
    g.bells.connect(g.live); g.bells.connect(bSend); bSend.connect(g.send);
    g.send.connect(g.conv); g.conv.connect(g.wet); g.wet.connect(g.live);
    g.live.connect(g.master); g.master.connect(g.comp); g.comp.connect(g.shaper); g.shaper.connect(ctx.destination);
    return g;
  }
  function tone(ctx, dest, t, f, peak, attack, tau, stop, cents) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = f; if (cents) o.detune.value = cents;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.setTargetAtTime(0, t + attack, tau);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + stop);
    return o;
  }
  function pluck(ctx, bus, t, f, vel) {
    var lp = ctx.createBiquadFilter(), out = ctx.createGain();
    lp.type = "lowpass"; lp.Q.value = 0.6;
    lp.frequency.setValueAtTime(3000, t); lp.frequency.exponentialRampToValueAtTime(650, t + 3.2);
    out.gain.value = vel * 0.045;
    lp.connect(out); out.connect(bus);
    for (var k = 1; k <= 9; k++) {
      var amp = 1 / Math.pow(k, 1.05) * (k >= 3 && k <= 6 ? 1.25 : 1);   // a little jawari bloom in the mids
      var cents = (Math.random() * 2 - 1) * 4;
      tone(ctx, lp, t, f * k, amp, 0.01, 1.7 / (1 + 0.32 * (k - 1)), 8, cents);
      if (k <= 2) tone(ctx, lp, t, f * k, amp * 0.55, 0.012, 1.9 / k, 8, 6 + cents);   // detuned twin: slow shimmer
    }
  }
  function noteVoice(ctx, bus, t, f, pan, vel) {
    var out = ctx.createGain(), tail = out;
    out.gain.value = vel * 0.04;
    if (ctx.createStereoPanner) { var p = ctx.createStereoPanner(); p.pan.value = pan; out.connect(p); tail = p; }
    tail.connect(bus);
    var o = tone(ctx, out, t, f, 1, 0.006, 0.42, 2.6, 0);
    tone(ctx, out, t, f * 2, 0.3, 0.005, 0.2, 1.4, 3);
    tone(ctx, out, t, f * 3, 0.1, 0.005, 0.12, 1.0, -3);
    tone(ctx, out, t, f * 2.76, 0.05, 0.004, 0.07, 0.7, 0);
    return o;
  }
  var BELL = [[0.5, 0.5], [1, 1], [1.183, 0.55], [1.506, 0.4], [2, 0.5], [2.514, 0.25], [2.662, 0.2], [3.011, 0.12], [4.166, 0.08]];
  function bell(ctx, bus, t, f, vel, secs) {
    var out = ctx.createGain(); out.gain.value = vel * 0.17; out.connect(bus);
    for (var i = 0; i < BELL.length; i++) {
      var r = BELL[i][0], a = BELL[i][1], d = secs / (0.8 + 0.45 * r);
      for (var j = 0; j < (r === 1 || r === 0.5 ? 2 : 1); j++) {   // beating pair on hum and prime
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f * r * (j ? 1.0035 : 1);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(a * (j ? 0.6 : 1), t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0003, t + d);
        o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05);
      }
    }
  }

  // ---------- live engine ----------
  var E = {
    ctx: null, g: null, an: null, on: false, chant: true, view: "connecting", stale: false,
    lastEv: 0, lastState: 0, queue: [], nextSlot: 0, grid0: 0, stamps: [], voices: 0,
    nextPluck: 0, pluckIdx: 0, nextGBell: 0, active: false, speaking: false, hi: null, timer: 0, offTimer: 0, droneRamp: false
  };
  function now() { return performance.now(); }
  function ramp(param, to, secs) {
    var t = E.ctx.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(to, t + secs);
  }
  function ensureCtx() {
    if (E.ctx) return true;
    if (!AC) return false;
    try { E.ctx = new AC(); } catch (e) { return false; }
    E.g = makeGraph(E.ctx);
    E.an = E.ctx.createAnalyser(); E.an.fftSize = 2048; E.g.shaper.connect(E.an);
    E.grid0 = E.ctx.currentTime;
    E.ctx.onstatechange = function () { if (E.on && !document.hidden && E.ctx.state !== "running") { try { E.ctx.resume(); } catch (e) {} } };
    try { var b = E.ctx.createBuffer(1, 1, 22050), s = E.ctx.createBufferSource(); s.buffer = b; s.connect(E.ctx.destination); s.start(0); } catch (e) {}  // iOS unlock
    return true;
  }
  function wantActive() {
    if (!E.on || document.hidden || E.stale) return false;
    var n = now();
    if (E.view === "live") return n - E.lastEv < IDLE_MS;
    if (E.view === "gathering") return n - E.lastState < 12000;
    return false;
  }
  function tick() {
    if (!E.ctx || !E.on) return;
    var ctx = E.ctx, t = ctx.currentTime, want = wantActive();
    if (want !== E.active) {
      E.active = want;
      ramp(E.g.live.gain, want ? 1 : 0, want ? FADE_IN : FADE_OUT);
      if (want) { E.nextPluck = t + 0.05; E.nextGBell = t + 3; }
      else { E.queue.length = 0; cancelSpeech(); }
    }
    if (!E.active) return;
    var dTarget = E.view === "gathering" ? 1.3 : 1;
    if (!E.droneRamp && Math.abs(E.g.drone.gain.value - dTarget) > 0.01) { E.droneRamp = true; ramp(E.g.drone.gain, dTarget, 2); setTimeout(function () { E.droneRamp = false; }, 2100); }
    while (E.nextPluck < t + 0.4) {            // tanpura plucks, scheduled slightly ahead
      var c = CYCLE[E.pluckIdx++ % 4];
      pluck(ctx, E.g.drone, E.nextPluck, c.f, c.v);
      E.nextPluck += c.gap + (Math.random() - 0.5) * 0.05;
    }
    while (E.queue.length) {                   // notes: at most one per pulse slot
      var slot = Math.max(E.nextSlot, t + 0.01);
      slot = E.grid0 + Math.ceil((slot - E.grid0) / PULSE - 1e-6) * PULSE;
      if (slot > t + 0.2) break;
      var ev = E.queue.shift();
      E.nextSlot = slot + PULSE;
      if (E.voices >= VOICE_MAX) continue;
      E.stamps.push(slot);
      while (E.stamps.length && E.stamps[0] < slot - 1) E.stamps.shift();
      var vel = (1 / (1 + 0.1 * E.stamps.length)) * (0.9 + Math.random() * 0.2);
      var o = noteVoice(ctx, E.g.notes, slot + (Math.random() - 0.5) * 0.02, scaleHz(STATION_POS[ev.s]), ev.pan, vel);
      E.voices++; o.onended = function () { E.voices--; };
    }
    if (E.view === "gathering" && t > E.nextGBell) { bell(ctx, E.g.bells, t + 0.05, TONIC * 2, 0.45, 5); E.nextGBell = t + 4.5 + Math.random(); }
  }

  var api = {
    note: function (i) {
      if (E.view !== "resting") E.lastEv = now();

      verse.style.opacity = latin && !l1 ? 0 : 1;
    }, reduce ? 0 : 500);
  }
  function nextVoice(force) {
    if (view === "resting") { renderStatic(); return; }
    var vs = S.voices;
    if (!vs.length) { if (view === "connecting") return; return; }
    S.voiceIdx = (S.voiceIdx + 1) % vs.length;
    var v = vs[S.voiceIdx], lines = v.text.split("\n").map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 2);
    var st = stations[v.station] || stations[0];
    var g = Math.floor(v.agent / 9) === v.station ? v.agent : v.station * 9 + (v.agent % 9);
    featured = v.station;
    if (window.__snd) window.__snd.verse(lines.join(", "));
    showVerse(lines[0] || "", lines[1] || "", "AGENT " + pad3(g + 1) + "  ·  " + String(v.work_en || st.en).toUpperCase(), st.c, false, "v" + v.station + ":" + v.text + ":" + S.voiceIdx);
  }
  function startVerseTimer() { verseTimerOn = true; setInterval(function () { if (!document.hidden) nextVoice(false); }, 5000); }

  // ---------- resting / static lines ----------
  var feedText = $("feedText"), feedDot = $("feedDot"), feedKey = "";
  var feedText2 = $("feedText2"), feedLast = null;
  function feedStyle(node, fs, ls) { node.setAttribute("font-size", fs); node.style.letterSpacing = ls + "em"; }
  // Fit the feed line inside a 16 px gutter at any card width: tighten spacing, then size, then two lines.
  function setFeed(text, color) {
    var key = text + color + "|" + frameEl.clientWidth;
    feedLast = { text: text, color: color };
    if (key === feedKey) return;
    feedKey = key;
    var maxW = 1080 - 2 * 16 * 1080 / Math.max(240, frameEl.clientWidth) - 80, ls = 0.3, fs = 22, two = false;
    feedText2.textContent = "";
    feedText.textContent = text; feedStyle(feedText, fs, ls);
    while (feedText.getComputedTextLength() > maxW && ls > 0.1) { ls = Math.max(0.1, ls - 0.04); feedStyle(feedText, fs, ls); }
    while (feedText.getComputedTextLength() > maxW && fs > 18) { fs -= 1; feedStyle(feedText, fs, ls); }
    if (feedText.getComputedTextLength() > maxW) {
      var cut = text.indexOf("  ·  "), mid = text.length / 2;
      if (cut < 0 || Math.abs(cut - mid) > mid * 0.7) { cut = text.lastIndexOf(" ", mid); if (cut < 0) cut = text.indexOf(" "); }
      if (cut > 0) {
        two = true;
        feedText.textContent = text.slice(0, cut).replace(/s+$/, ""); feedText2.textContent = text.slice(cut).replace(/^[s·]+/, "");
        fs = 22; ls = 0.2; feedStyle(feedText, fs, ls); feedStyle(feedText2, fs, ls);
        while ((feedText.getComputedTextLength() > maxW || feedText2.getComputedTextLength() > maxW) && ls > 0.06) { ls -= 0.04; feedStyle(feedText, fs, ls); feedStyle(feedText2, fs, ls); }
        while ((feedText.getComputedTextLength() > maxW || feedText2.getComputedTextLength() > maxW) && fs > 16) { fs -= 1; feedStyle(feedText, fs, ls); feedStyle(feedText2, fs, ls); }
      }
    }
    feedText.setAttribute("y", two ? 1738 : 1762);
    feedDot.setAttribute("fill", color);
    feedDot.setAttribute("cy", two ? 1729 : 1753);
    feedDot.setAttribute("cx", (540 - feedText.getComputedTextLength() / 2 - 22).toFixed(0));
  }
  function clockOf(ts) {
    try { return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; }
  }
  function renderStatic() {
    if (view === "connecting") { setFeed("CONNECTING TO THE PRAYER", "#ffd27a"); return; }
    if (view === "gathering") { setFeed("THE PANDIT AGENTS GATHER FOR THE SUNRISE VANDANA", "#ffe2a0"); return; }
    if (view === "resting") {
      var ts = (S.state && S.state.ts) || S.offlineSince;
      setFeed("THE PANDIT AGENTS ARE RESTING" + (ts ? "  ·  LAST PRAYER " + clockOf(ts) : ""), "#8a7a86");
      showVerse("The 108 pandit agents are resting.", "The prayer resumes when they wake.", S.state ? "LAST KNOWN COUNTS BELOW" : "NOTHING IS SIMULATED", "#ffd27a", true, "resting");
      featured = -1;
    }
  }

  // ---------- frame loop ----------
  var prev = nowT, lastFeedAt = 0;
  var nShloka = $("nShloka"), nMala = $("nMala"), auraC = $("auraC"), coreGlow = $("coreGlow"), omG = $("omG");
  function frame(ms) {
    requestAnimationFrame(frame);
    var t = ms / 1000, dt = Math.min(0.1, t - prev); prev = t;
    var gath = view === "gathering", rest = view === "resting";

    dim += ((rest ? 0.45 : 1) - dim) * Math.min(1, dt * 3);
    var decay = Math.exp(-dt / 1.1);
    for (var i = 0; i < 108; i++) {
      var b = beads[i];
      b.lit = Math.max(b.floor, b.lit * decay);
      b.boost *= decay;
      var sw = b.sweepAt > t ? 0 : Math.max(0, 1 - (t - b.sweepAt) / 0.5);
      var k = Math.max(b.lit, sw), base = (0.3 + 0.7 * k) * dim;
      var key = Math.round(k * 30) + "/" + Math.round(sw * 10) + "/" + Math.round(dim * 20) + "/" + Math.round(b.boost * 4);
      if (key !== b.shown) {
        b.shown = key;
        var r = b.col[0] * base, gg = b.col[1] * base, bb = b.col[2] * base, wmix = Math.max(sw, k * k * 0.45);
        b.dot.setAttribute("fill", "rgb(" + Math.round(r + (255 - r) * wmix) + "," + Math.round(gg + (255 - gg) * wmix) + "," + Math.round(bb + (255 - bb) * wmix) + ")");
        b.dot.setAttribute("r", (8.5 + 4 * k + 2.5 * b.boost).toFixed(2));
        b.halo.setAttribute("opacity", (k * dim).toFixed(2));
      }
    }

    // counters: ease toward state + batches, never run backwards
    var target = S.base + S.extra;
    if (S.state && S.disp < target) {
      S.disp += (target - S.disp) * (1 - Math.exp(-dt / 0.3));
      if (target - S.disp < 0.5) S.disp = target;
    }
    if (S.state) {
      var shownN = Math.round(S.disp);
      if (shownN !== S.shown) {
        S.shown = shownN;
        nShloka.textContent = fmt.format(shownN);
        var malas = Math.floor(shownN / 108);
        if (malas > S.lastMala && !S.snap && !rest && t - S.lastSweep > 1.3) {
          S.lastSweep = t;
          if (window.__snd) window.__snd.bell();
          for (var j = 0; j < 108; j++) beads[j].sweepAt = t + j / 108 * 1.3;
          if (!reduce) { ripples.push({ t0: t }); ripples.push({ t0: t + 0.25 }); ripples.push({ t0: t + 0.5 }); }
          nMala.classList.remove("bump"); void nMala.getBBox(); nMala.classList.add("bump");
          omEnergy = 1;
        }
        S.lastMala = malas;
        if (S.snap && S.disp === target) S.snap = false;
        nMala.textContent = fmt.format(malas);
      }
    }

    // live feed line (throttled; layout only when text changes)
    if (view === "live" && S.latest && t - lastFeedAt > 0.45) {
      lastFeedAt = t;
      var st = stations[Math.floor(S.latest.i / 9)];
      setFeed("AGENT " + pad3(S.latest.i + 1) + " OFFERED A " + st.unit + "  ·  " + st.en, st.c);
    } else if (view === "live" && !S.latest && t - lastFeedAt > 1) { lastFeedAt = t; setFeed("WAITING FOR THE NEXT OFFERING", "#ffd27a"); }

    // petals breathe with their station
    for (var s = 0; s < 12; s++) {
      var floorE = gath ? 1 : rest ? 0.1 : 0.25;
      energy[s] = Math.max(floorE, energy[s] * Math.exp(-dt / 2.2));
      var boost = (s === featured && !rest) ? 0.25 : 0, q = Math.round(Math.min(1, energy[s] + boost) * 25);
      if (q !== shownE[s]) { shownE[s] = q; petals[s].setAttribute("fill-opacity", (0.14 + 0.5 * q / 25).toFixed(2)); }
    }

    // om and aura
    omEnergy *= Math.exp(-dt / 0.8);
    var breath = reduce ? 0.5 : 0.5 + 0.5 * Math.sin(t * 1.3);
    var rd = rest ? -0.18 : 0, gd = gath ? 0.25 : 0;
    auraC.setAttribute("opacity", Math.max(0, 0.42 + rd + gd + 0.14 * breath + 0.3 * omEnergy).toFixed(3));
    coreGlow.setAttribute("opacity", Math.max(0, 0.35 + rd + gd + 0.25 * breath + 0.4 * omEnergy).toFixed(3));
    omG.setAttribute("transform", "scale(" + (1 + 0.025 * breath + 0.07 * omEnergy).toFixed(4) + ")");

    // canvas
    ctx.clearRect(0, 0, 1080, 1920);
    ctx.globalCompositeOperation = "lighter";
    if (!reduce) {
      var emA = rest ? 0.4 : 1;
      for (var n = 0; n < embers.length; n++) {
        var em = embers[n];
        em.y -= em.v * dt; if (em.y < -10) { em.y = 1930; em.x = Math.random() * 1080; }
        var ex = em.x + Math.sin(t * 0.9 + em.ph) * 26;
        ctx.globalAlpha = em.a * emA * (0.6 + 0.4 * Math.sin(t * 3 + em.ph));
        ctx.fillStyle = "#ffc46b";
        ctx.beginPath(); ctx.arc(ex, em.y, em.r, 0, 6.2832); ctx.fill();
      }
    }
    for (n = ripples.length - 1; n >= 0; n--) {
      var u = (t - ripples[n].t0) / 2.2;
      if (u > 1) { ripples.splice(n, 1); continue; }
      if (u < 0) continue;
      ctx.globalAlpha = (1 - u) * 0.75; ctx.strokeStyle = "#ffe2a0"; ctx.lineWidth = 5 * (1 - u) + 1;
      ctx.beginPath(); ctx.arc(CX, CY, 150 + 420 * (1 - (1 - u) * (1 - u)), 0, 6.2832); ctx.stroke();
    }
    ctx.lineCap = "round";
    for (n = sparks.length - 1; n >= 0; n--) {
      var sp = sparks[n], uu = (t - sp.t0) / 1.25;
      if (uu >= 1) { sparks.splice(n, 1); omEnergy = Math.min(1, omEnergy + 0.07); continue; }
      var head = sparkPos(sp, uu), tail = sparkPos(sp, Math.max(0, uu - 0.16));
      ctx.globalAlpha = 0.55; ctx.strokeStyle = sp.hex; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(tail[0], tail[1]); ctx.lineTo(head[0], head[1]); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(head[0], head[1], 4.5, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.fillStyle = sp.hex;
      ctx.beginPath(); ctx.arc(head[0], head[1], 10, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- connection ----------
  var ws = null, retry = 0, failStreak = 0, reconnectTimer = 0, pollTimer = 0, hiddenTimer = 0, closedForHidden = false;
  function stopPoll() { clearTimeout(pollTimer); pollTimer = 0; S.polling = false; }
  function poll() {
    S.polling = true;
    fetch("/state", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) { handle(j); }).catch(function () {}).then(function () {
      if (S.polling) pollTimer = setTimeout(poll, S.offline ? 30000 : 10000);
    });
  }
  function startPoll() { if (!pollTimer && !S.polling) poll(); }
  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    var delay = Math.min(30000, 1000 * Math.pow(2, retry++)) * (0.7 + Math.random() * 0.6);
    reconnectTimer = setTimeout(connect, delay);
  }
  function connect() {
    if (DEMO || ws || document.hidden && closedForHidden) return;
    if (location.protocol !== "http:" && location.protocol !== "https:") return;
    var sock, opened = false;
    try { sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/live"); }
    catch (e) { failStreak++; if (failStreak >= 2) startPoll(); scheduleReconnect(); return; }
    ws = sock;
    sock.onopen = function () { opened = true; retry = 0; failStreak = 0; S.lastMsgAt = Date.now(); stopPoll(); };
    sock.onmessage = function (ev) { if (typeof ev.data === "string") handle(ev.data); };
    sock.onclose = function () {
      if (ws === sock) ws = null;
      if (!opened) { failStreak++; if (failStreak >= 2) startPoll(); }
      if (!(document.hidden && closedForHidden)) scheduleReconnect();
    };
    sock.onerror = function () { /* onclose follows */ };
  }
  setInterval(function () {
    var stale = !DEMO && S.lastMsgAt > 0 && Date.now() - S.lastMsgAt > 50000;
    if (stale !== !!S.stale) { S.stale = stale; applyView(); }
    if (ws && ws.readyState === 1 && S.lastMsgAt && Date.now() - S.lastMsgAt > 45000) { try { ws.close(); } catch (e) {} }
  }, 5000);
  document.addEventListener("visibilitychange", function () {
    if (DEMO) return;
    if (document.hidden) {
      clearTimeout(hiddenTimer);
      hiddenTimer = setTimeout(function () { closedForHidden = true; clearTimeout(reconnectTimer); stopPoll(); if (ws) { try { ws.close(); } catch (e) {} } }, 60000);
    } else {
      clearTimeout(hiddenTimer);
      if (closedForHidden) { closedForHidden = false; retry = 0; connect(); }
      prev = performance.now() / 1000;
    }
  });

  // ---------- demo (local simulation, clearly labelled) ----------
  function startDemo() {
    $("demoBadge").setAttribute("display", "inline");
    var kind = demoParam, units = 431208 + Math.floor(Math.random() * 200), day = 12;
    var demoVerses = [
      ["ॐ नमः शिवाय", "", "Om Namah Shivaya"], ["नमामीशमीशान निर्वाणरूपं", "विभुं व्यापकं ब्रह्मवेदस्वरूपम्", "Rudrashtakam"],
      ["ॐ त्र्यम्बकं यजामहे", "सुगन्धिं पुष्टिवर्धनम्", "Mahamrityunjaya"], ["या देवी सर्वभूतेषु", "शक्तिरूपेण संस्थिता", "Durga Saptashati"],
      ["नमो नमो दुर्गे सुख करनी", "नमो नमो अम्बे दुःख हरनी", "Durga Chalisa"], ["वक्रतुण्ड महाकाय", "सूर्यकोटि समप्रभ", "Vakratunda"],
      ["मंगल भवन अमंगल हारी", "द्रवहु सो दसरथ अजिर बिहारी", "Ramcharitmanas"], ["जय हनुमान ज्ञान गुन सागर", "जय कपीस तिहुँ लोक उजागर", "Hanuman Chalisa"],
      ["शान्ताकारं भुजगशयनं", "पद्मनाभं सुरेशम्", "Vishnu Dhyanam"], ["ॐ श्रीं महालक्ष्म्यै नमः", "", "Lakshmi Mantra"],
      ["ॐ भूर्भुवः स्वः", "तत्सवितुर्वरेण्यम्", "Gayatri Mantra"], ["ॐ शं शनैश्चराय नमः", "", "Navagraha Mantra"]
    ];
    var holders = { "3": 0, "6": 0 }, mode = kind === "gathering" ? "gathering" : kind === "resting" ? "resting" : "praying";
    function state() {
      var voices = demoVerses.map(function (v, s) { return { station: s, agent: s * 9 + Math.floor(Math.random() * 9), work_en: v[2], text: v[1] ? v[0] + "\n" + v[1] : v[0] }; });
      var sts = []; for (var s = 0; s < 12; s++) sts.push({ units_today: Math.floor(units / 12), active: s === 3 || s === 6 ? 1 : 9 });
      handle({ t: "state", ts: Date.now(), mode: mode, provider: "iceman", name: "Mehul", day: day, streak_days: day, today: { units: units, malas: Math.floor(units / 108), corrections: 41 }, all_time: { units: units + 5e6, malas: 47407 }, stations: sts, voices: voices, relay_holders: holders });
    }
    state();
    if (kind === "resting") { handle({ t: "offline", since: Date.now() - 60000 }); return; }
    setInterval(state, 5000);
    if (mode === "gathering") return;
    setInterval(function () {
      holders["3"] = (holders["3"] + (Math.random() < 0.15 ? 1 : 0)) % 9; holders["6"] = (holders["6"] + (Math.random() < 0.2 ? 1 : 0)) % 9;
      var ev = [], n = 8 + Math.floor(Math.random() * 7);
      for (var q = 0; q < n; q++) {
        var a = Math.floor(Math.random() * 108), st = Math.floor(a / 9);
        if (st === 3 || st === 6) a = st * 9 + holders[String(st)];
        ev.push([a, Math.random() < 0.1 ? 3 : 1]);
      }
      units += ev.reduce(function (z, e) { return z + e[1]; }, 0);
      handle({ t: "batch", ts: Date.now(), ev: ev });
    }, 1000);
  }

  // ---------- go ----------
  applyView();
  renderStatic();
  requestAnimationFrame(frame);
  if (DEMO) startDemo(); else connect();
  window.__akhand = { S: S, beads: beads, handle: handle, view: function () { return view; } };
})();
